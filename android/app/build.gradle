plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "local.exitcall"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "local.exitcall"
        minSdk 26
        targetSdk 35
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    def previousDebugKey = rootProject.file("../.tooling/exit-call-debug.keystore")
    if (previousDebugKey.exists()) {
        signingConfigs.debug.storeFile = previousDebugKey
    }
    buildTypes {
        release {
            if (!providers.gradleProperty('fdroid').isPresent()) {
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source "../.."
}
