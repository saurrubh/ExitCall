Categories:
  - Phone & SMS
License: MIT
SourceCode: https://github.com/saurrubh/endcalls
IssueTracker: https://github.com/saurrubh/endcalls/issues

AutoName: Exit Call

RepoType: git
Repo: https://github.com/saurrubh/endcalls.git

Builds:
  - versionName: 1.3.2
    versionCode: 7
    commit: v1.3.2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@ae9b586f34a8443573f82ef57c3bf914a908cbf7
    prebuild:
      - printf '\nfdroid=true\n' >> android/gradle.properties
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --no-pub
    ndk: r28c

AutoUpdateMode: None
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.3.2
CurrentVersionCode: 7
